spring:
  application:
    name: easypipe-examples

  datasource:
    url: jdbc:postgresql://localhost:5432/easypipe
    username: easypipe
    password: easypipe
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5

  flyway:
    enabled: true
    locations: classpath:db/migration

easy-pipe:
  enabled: true

logging:
  level:
    root: INFO
    com.easypipe: INFO